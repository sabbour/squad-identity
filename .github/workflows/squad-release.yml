name: Release

on:
  push:
    branches: [main, insider]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm test

      # On main: publishes with --tag latest (default changesets behavior)
      - name: Create Release PR or Publish
        if: github.ref == 'refs/heads/main'
        id: changesets-stable
        uses: changesets/action@v1
        with:
          publish: npm run release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # On insider: publishes with --tag insider (pre-release channel)
      - name: Publish Insider Pre-release
        if: github.ref == 'refs/heads/insider'
        id: changesets-insider
        uses: changesets/action@v1
        with:
          publish: npm run release
          title: "chore: version packages (insider)"
          commit: "chore: version packages (insider)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
